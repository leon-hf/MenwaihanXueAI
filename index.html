<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

  margin-bottom: 6px;
}

  color: #fff;

}

.toc-article:hover {

  background: #fff;

// ============ 渲染三级目录：篇 > 章 > 篇 ============
function renderTOC() {
  const tree = document.getElementById('tocTree');
  let html = '';
  let currentPart = '';
  let currentCh = '';

  ARTICLES.forEach((art, idx) => {
    // 篇标题
    if (art.part !== currentPart) {
      currentPart = art.part;
      currentCh = '';
      html += `<div class="toc-part-title">${currentPart}</div>`;
    }
    // 章标题
    if (art.ch !== currentCh) {
      currentCh = art.ch;
      html += `<div class="toc-ch-title">${currentCh}</div>`;
    }
    // 篇链接
    html += `<a class="toc-article" data-idx="${idx}" onclick="loadArticle(${idx})">` +
            `<span class="art-num">${art.n}</span><span class="art-title">${art.title}</span></a>`;
  });

  tree.innerHTML = html;
}

// ============ 加载文章 ============
let currentIdx = -1;

function loadArticle(idx) {
  if (idx < 0 || idx >= ARTICLES.length) return;

  currentIdx = idx;
  const art = ARTICLES[idx];

  // 加载 HTML
  document.getElementById('contentFrame').src = art.file;

  // 更新标题
  document.getElementById('navTitle').textContent = `第${art.n}篇 · ${art.title}`;

  // 更新按钮状态
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === ARTICLES.length - 1);

  // 高亮当前文章
  document.querySelectorAll('.toc-article').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.toc-article[data-idx="${idx}"]`);
  if (activeEl) {
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // 移动端关闭侧边栏
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  // 滚动到顶部
  document.getElementById('contentFrame').onload = function() {
    try { this.contentWindow.scrollTo(0, 0); } catch(e) {}
  };
}

// ============ 上一篇 / 下一篇 ============
function navPrev() {
  if (currentIdx > 0) loadArticle(currentIdx - 1);
}

function navNext() {
  if (currentIdx < ARTICLES.length - 1) loadArticle(currentIdx + 1);
}

// ============ 移动端侧边栏切换 ============
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

// ============ 键盘快捷键 ============
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' && currentIdx > 0) navPrev();
  if (e.key === 'ArrowRight' && currentIdx < ARTICLES.length - 1) navNext();
  if (e.key === 'Escape') {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
});

// ============ 初始化 ============
renderTOC();

// 检查URL参数，自动定位到指定文章
var params = new URLSearchParams(window.location.search);
var articleNum = params.get('article');
if (articleNum) {
  var idx = parseInt(articleNum) - 1;
  if (idx >= 0 && idx < ARTICLES.length) {
    loadArticle(idx);
  } else {
    document.getElementById('contentFrame').src = 'book_toc.html';
    document.getElementById('navTitle').textContent = '目录 · 点击左侧选择篇章';
    document.getElementById('prevBtn').disabled = true;
  }
} else {
  // 默认加载目录页
  document.getElementById('contentFrame').src = 'book_toc.html';
  document.getElementById('navTitle').textContent = '目录 · 点击左侧选择篇章';
  document.getElementById('prevBtn').disabled = true;
}

// ============ iOS Safari bfcache 恢复修复 ============
// 页面从缓存恢复时，强制重新计算布局
window.addEventListener('pageshow', function(event) {
  if (event.persisted) {
    // 页面从 bfcache 恢复，强制重排
    document.body.style.display = 'none';
    document.body.offsetHeight; // 触发重排
    document.body.style.display = 'flex';
  }
});

// 视口变化时刷新（地址栏显示/隐藏）
window.addEventListener('resize', function() {
  document.body.style.height = window.innerHeight + 'px';
});
document.body.style.height = window.innerHeight + 'px';
</script>
